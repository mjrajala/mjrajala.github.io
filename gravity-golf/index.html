<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gravity Golf ⛳🚀</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  overflow: hidden;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
  color: #e0e0e0;
  touch-action: none;
  user-select: none;
}

canvas {
  display: block;
  cursor: crosshair;
}

#ui-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  pointer-events: none;
  z-index: 10;
  padding: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.ui-panel {
  background: rgba(10, 10, 30, 0.85);
  border: 1px solid rgba(100, 200, 255, 0.2);
  border-radius: 12px;
  padding: 12px 18px;
  backdrop-filter: blur(10px);
  pointer-events: auto;
}

.ui-panel h2 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: rgba(100, 200, 255, 0.6);
  margin-bottom: 6px;
}

.stat {
  font-size: 22px;
  font-weight: bold;
  color: #64c8ff;
}

.stat-small {
  font-size: 13px;
  color: rgba(200, 200, 255, 0.7);
}

#level-info { text-align: left; }
#score-info { text-align: right; }

#message-overlay {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}

#message-overlay.visible { opacity: 1; }

#message-overlay h1 {
  font-size: 48px;
  color: #64c8ff;
  text-shadow: 0 0 30px rgba(100, 200, 255, 0.5);
  margin-bottom: 12px;
}

#message-overlay p {
  font-size: 18px;
  color: rgba(200, 200, 255, 0.7);
}

#instructions {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  font-size: 13px;
  color: rgba(200, 200, 255, 0.4);
  pointer-events: none;
  transition: opacity 1s;
}

#restart-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 15;
  background: rgba(100, 200, 255, 0.15);
  border: 1px solid rgba(100, 200, 255, 0.3);
  color: #64c8ff;
  padding: 8px 16px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
#restart-btn:hover {
  background: rgba(100, 200, 255, 0.25);
  border-color: rgba(100, 200, 255, 0.5);
}

.power-meter {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  width: 200px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  z-index: 10;
  display: none;
}
.power-meter-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #00ff88, #ffaa00, #ff4444);
  transition: width 0.05s;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-overlay">
  <div class="ui-panel" id="level-info">
    <h2>Level</h2>
    <div class="stat" id="level-num">1</div>
    <div class="stat-small" id="level-name">First Launch</div>
  </div>
  <div class="ui-panel" id="score-info">
    <h2>Shots</h2>
    <div class="stat" id="shot-count">0</div>
    <div class="stat-small">Par: <span id="par-count">3</span></div>
  </div>
</div>

<div id="message-overlay">
  <h1 id="msg-title"></h1>
  <p id="msg-sub"></p>
</div>

<div id="instructions">Click & drag from the ball to launch · Avoid planets · Reach the target 🎯</div>

<div class="power-meter" id="power-meter">
  <div class="power-meter-fill" id="power-fill"></div>
</div>

<button id="restart-btn" onclick="restartLevel()">↻ Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Physics constants
const G = 800; // gravitational constant
const TRAIL_LENGTH = 120;
const BALL_RADIUS = 8;
const TARGET_RADIUS = 20;
const MAX_SPEED = 600;
const DAMPING = 0.999;

// Game state
let ball, target, planets, trails, particles, state, shotCount, totalShots;
let dragStart = null, dragEnd = null, isDragging = false;
let currentLevel = 0;
let predictPath = [];

// Stars background
const stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random(),
    y: Math.random(),
    size: Math.random() * 2 + 0.5,
    brightness: Math.random() * 0.5 + 0.5,
    twinkleSpeed: Math.random() * 2 + 1
  });
}

// Level definitions
const levels = [
  {
    name: "First Launch",
    par: 2,
    ball: { x: 0.15, y: 0.5 },
    target: { x: 0.85, y: 0.5 },
    planets: []
  },
  {
    name: "Gentle Curve",
    par: 2,
    ball: { x: 0.15, y: 0.5 },
    target: { x: 0.85, y: 0.5 },
    planets: [
      { x: 0.5, y: 0.5, mass: 5000, radius: 30, color: '#ff6644' }
    ]
  },
  {
    name: "Binary Stars",
    par: 3,
    ball: { x: 0.1, y: 0.5 },
    target: { x: 0.9, y: 0.5 },
    planets: [
      { x: 0.4, y: 0.35, mass: 4000, radius: 25, color: '#ff8844' },
      { x: 0.6, y: 0.65, mass: 4000, radius: 25, color: '#44aaff' }
    ]
  },
  {
    name: "Slingshot",
    par: 3,
    ball: { x: 0.1, y: 0.8 },
    target: { x: 0.9, y: 0.2 },
    planets: [
      { x: 0.5, y: 0.5, mass: 8000, radius: 40, color: '#ffaa22' }
    ]
  },
  {
    name: "The Gauntlet",
    par: 4,
    ball: { x: 0.1, y: 0.5 },
    target: { x: 0.9, y: 0.5 },
    planets: [
      { x: 0.3, y: 0.3, mass: 3000, radius: 20, color: '#ff4488' },
      { x: 0.5, y: 0.7, mass: 4500, radius: 28, color: '#44ff88' },
      { x: 0.7, y: 0.35, mass: 3500, radius: 22, color: '#8844ff' }
    ]
  },
  {
    name: "Orbit Trap",
    par: 3,
    ball: { x: 0.1, y: 0.5 },
    target: { x: 0.5, y: 0.15 },
    planets: [
      { x: 0.5, y: 0.5, mass: 10000, radius: 45, color: '#ff6600' },
      { x: 0.8, y: 0.8, mass: 2000, radius: 18, color: '#66ccff' }
    ]
  },
  {
    name: "Triple Threat",
    par: 4,
    ball: { x: 0.5, y: 0.9 },
    target: { x: 0.5, y: 0.1 },
    planets: [
      { x: 0.25, y: 0.5, mass: 4000, radius: 25, color: '#ff4444' },
      { x: 0.5, y: 0.4, mass: 5000, radius: 30, color: '#44ff44' },
      { x: 0.75, y: 0.5, mass: 4000, radius: 25, color: '#4444ff' }
    ]
  },
  {
    name: "Needle's Eye",
    par: 4,
    ball: { x: 0.1, y: 0.9 },
    target: { x: 0.9, y: 0.1 },
    planets: [
      { x: 0.35, y: 0.6, mass: 5000, radius: 30, color: '#ff8800' },
      { x: 0.65, y: 0.4, mass: 5000, radius: 30, color: '#0088ff' },
      { x: 0.5, y: 0.5, mass: 2000, radius: 15, color: '#ff44ff' }
    ]
  },
  {
    name: "Cosmic Pinball",
    par: 5,
    ball: { x: 0.05, y: 0.5 },
    target: { x: 0.95, y: 0.5 },
    planets: [
      { x: 0.2, y: 0.3, mass: 3000, radius: 20, color: '#ff6666' },
      { x: 0.4, y: 0.7, mass: 3500, radius: 22, color: '#66ff66' },
      { x: 0.6, y: 0.25, mass: 4000, radius: 25, color: '#6666ff' },
      { x: 0.8, y: 0.65, mass: 3000, radius: 20, color: '#ffff66' }
    ]
  },
  {
    name: "The Physicist's Dream",
    par: 5,
    ball: { x: 0.05, y: 0.95 },
    target: { x: 0.95, y: 0.05 },
    planets: [
      { x: 0.3, y: 0.7, mass: 6000, radius: 35, color: '#ff4400' },
      { x: 0.5, y: 0.5, mass: 8000, radius: 40, color: '#ffcc00' },
      { x: 0.7, y: 0.3, mass: 6000, radius: 35, color: '#00ccff' },
      { x: 0.2, y: 0.3, mass: 2500, radius: 16, color: '#ff66ff' },
      { x: 0.8, y: 0.7, mass: 2500, radius: 16, color: '#66ffcc' }
    ]
  }
];

function loadLevel(idx) {
  const lvl = levels[idx];
  state = 'aiming';
  shotCount = 0;
  trails = [];
  particles = [];
  predictPath = [];

  ball = {
    x: lvl.ball.x * W,
    y: lvl.ball.y * H,
    vx: 0, vy: 0,
    startX: lvl.ball.x * W,
    startY: lvl.ball.y * H,
    alive: true
  };

  target = {
    x: lvl.target.x * W,
    y: lvl.target.y * H,
    pulse: 0
  };

  planets = lvl.planets.map(p => ({
    x: p.x * W,
    y: p.y * H,
    mass: p.mass,
    radius: p.radius,
    color: p.color,
    glowPhase: Math.random() * Math.PI * 2
  }));

  document.getElementById('level-num').textContent = idx + 1;
  document.getElementById('level-name').textContent = lvl.name;
  document.getElementById('par-count').textContent = lvl.par;
  document.getElementById('shot-count').textContent = '0';

  showMessage(lvl.name, `Level ${idx + 1} of ${levels.length}`, 2000);
}

function resetBall() {
  ball.x = ball.startX;
  ball.y = ball.startY;
  ball.vx = 0;
  ball.vy = 0;
  ball.alive = true;
  trails = [];
  state = 'aiming';
}

function restartLevel() {
  loadLevel(currentLevel);
}

// Physics
function computeGravity(px, py) {
  let ax = 0, ay = 0;
  for (const p of planets) {
    const dx = p.x - px;
    const dy = p.y - py;
    const distSq = dx * dx + dy * dy;
    const dist = Math.sqrt(distSq);
    if (dist < p.radius) return null; // collision
    const force = G * p.mass / distSq;
    ax += force * dx / dist;
    ay += force * dy / dist;
  }
  return { ax, ay };
}

function predictTrajectory(sx, sy, vx, vy, steps) {
  const path = [];
  let px = sx, py = sy, pvx = vx, pvy = vy;
  const dt = 1/60;
  for (let i = 0; i < steps; i++) {
    const g = computeGravity(px, py);
    if (!g) break;
    pvx += g.ax * dt;
    pvy += g.ay * dt;
    px += pvx * dt;
    py += pvy * dt;
    if (px < -100 || px > W + 100 || py < -100 || py > H + 100) break;
    if (i % 2 === 0) path.push({ x: px, y: py });
  }
  return path;
}

function updatePhysics(dt) {
  if (state !== 'flying' || !ball.alive) return;

  const g = computeGravity(ball.x, ball.y);
  if (!g) {
    // Hit a planet
    ball.alive = false;
    spawnExplosion(ball.x, ball.y, '#ff4444');
    setTimeout(resetBall, 1500);
    return;
  }

  ball.vx += g.ax * dt;
  ball.vy += g.ay * dt;
  ball.vx *= DAMPING;
  ball.vy *= DAMPING;

  // Clamp speed
  const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (speed > MAX_SPEED) {
    ball.vx = (ball.vx / speed) * MAX_SPEED;
    ball.vy = (ball.vy / speed) * MAX_SPEED;
  }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  // Trail
  trails.push({ x: ball.x, y: ball.y, age: 0 });
  if (trails.length > TRAIL_LENGTH) trails.shift();

  // Check target
  const dx = ball.x - target.x;
  const dy = ball.y - target.y;
  if (Math.sqrt(dx * dx + dy * dy) < TARGET_RADIUS + BALL_RADIUS) {
    levelComplete();
    return;
  }

  // Out of bounds
  if (ball.x < -50 || ball.x > W + 50 || ball.y < -50 || ball.y > H + 50) {
    ball.alive = false;
    setTimeout(resetBall, 1000);
  }
}

function levelComplete() {
  state = 'complete';
  totalShots += shotCount;
  spawnExplosion(target.x, target.y, '#64c8ff');
  spawnExplosion(target.x, target.y, '#00ff88');

  const par = levels[currentLevel].par;
  let msg = '';
  if (shotCount <= par - 2) msg = 'EAGLE! 🦅';
  else if (shotCount <= par - 1) msg = 'BIRDIE! 🐦';
  else if (shotCount === par) msg = 'PAR! ⛳';
  else if (shotCount === par + 1) msg = 'BOGEY';
  else msg = `+${shotCount - par}`;

  const isLast = currentLevel >= levels.length - 1;
  const sub = isLast
    ? `Total shots: ${totalShots} · Click to play again!`
    : `${shotCount} shot${shotCount>1?'s':''} · Click for next level`;

  showMessage(msg, sub, isLast ? 5000 : 3000);

  setTimeout(() => {
    if (isLast) {
      currentLevel = 0;
      totalShots = 0;
    } else {
      currentLevel++;
    }
    loadLevel(currentLevel);
  }, isLast ? 5000 : 3000);
}

// Particles
function spawnExplosion(x, y, color) {
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 200 + 50;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: Math.random() * 0.02 + 0.01,
      size: Math.random() * 4 + 2,
      color
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.98;
    p.vy *= 0.98;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

// Drawing
function drawStars(t) {
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(t * s.twinkleSpeed);
    const alpha = s.brightness * twinkle;
    ctx.fillStyle = `rgba(200, 220, 255, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlanet(p, t) {
  // Gravity field visualization
  const glow = 0.3 + 0.1 * Math.sin(t * 2 + p.glowPhase);
  const fieldRadius = Math.sqrt(p.mass) * 2;
  const grad = ctx.createRadialGradient(p.x, p.y, p.radius, p.x, p.y, fieldRadius);
  grad.addColorStop(0, p.color + '33');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, fieldRadius, 0, Math.PI * 2);
  ctx.fill();

  // Orbit rings
  ctx.strokeStyle = p.color + '15';
  ctx.lineWidth = 1;
  for (let r = p.radius + 20; r < fieldRadius; r += 25) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Planet body
  const bodyGrad = ctx.createRadialGradient(
    p.x - p.radius * 0.3, p.y - p.radius * 0.3, 0,
    p.x, p.y, p.radius
  );
  bodyGrad.addColorStop(0, p.color);
  bodyGrad.addColorStop(1, '#111');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
  ctx.fill();

  // Glow
  ctx.shadowColor = p.color;
  ctx.shadowBlur = 20 * glow;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTarget(t) {
  target.pulse = (target.pulse + 0.03) % (Math.PI * 2);
  const pulse = 1 + 0.15 * Math.sin(target.pulse * 3);
  const r = TARGET_RADIUS * pulse;

  // Outer ring
  ctx.strokeStyle = `rgba(0, 255, 136, ${0.3 + 0.2 * Math.sin(t * 3)})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(target.x, target.y, r + 8, 0, Math.PI * 2);
  ctx.stroke();

  // Target circle
  const tGrad = ctx.createRadialGradient(target.x, target.y, 0, target.x, target.y, r);
  tGrad.addColorStop(0, '#00ff88');
  tGrad.addColorStop(0.5, '#00cc66');
  tGrad.addColorStop(1, 'rgba(0, 255, 136, 0.3)');
  ctx.fillStyle = tGrad;
  ctx.beginPath();
  ctx.arc(target.x, target.y, r, 0, Math.PI * 2);
  ctx.fill();

  // Flag icon
  ctx.fillStyle = '#fff';
  ctx.font = `${16 * pulse}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('⛳', target.x, target.y);
}

function drawBall() {
  if (!ball.alive) return;

  // Glow
  ctx.shadowColor = '#64c8ff';
  ctx.shadowBlur = 15;
  const bGrad = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 0, ball.x, ball.y, BALL_RADIUS);
  bGrad.addColorStop(0, '#ffffff');
  bGrad.addColorStop(0.5, '#64c8ff');
  bGrad.addColorStop(1, '#2266aa');
  ctx.fillStyle = bGrad;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawTrail() {
  if (trails.length < 2) return;
  for (let i = 1; i < trails.length; i++) {
    const alpha = i / trails.length;
    ctx.strokeStyle = `rgba(100, 200, 255, ${alpha * 0.6})`;
    ctx.lineWidth = alpha * 3;
    ctx.beginPath();
    ctx.moveTo(trails[i-1].x, trails[i-1].y);
    ctx.lineTo(trails[i].x, trails[i].y);
    ctx.stroke();
  }
}

function drawPrediction() {
  if (predictPath.length < 2) return;
  for (let i = 1; i < predictPath.length; i++) {
    const alpha = (1 - i / predictPath.length) * 0.4;
    ctx.strokeStyle = `rgba(100, 200, 255, ${alpha})`;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(predictPath[i-1].x, predictPath[i-1].y);
    ctx.lineTo(predictPath[i].x, predictPath[i].y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function drawAimLine() {
  if (!isDragging || !dragStart || !dragEnd) return;
  const dx = dragStart.x - dragEnd.x;
  const dy = dragStart.y - dragEnd.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const power = Math.min(dist / 200, 1);

  // Arrow line
  ctx.strokeStyle = `rgba(100, 200, 255, 0.6)`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ball.x, ball.y);
  ctx.lineTo(ball.x + dx * 0.5, ball.y + dy * 0.5);
  ctx.stroke();

  // Arrow head
  const angle = Math.atan2(dy, dx);
  const headLen = 12;
  ctx.beginPath();
  ctx.moveTo(ball.x + dx * 0.5, ball.y + dy * 0.5);
  ctx.lineTo(
    ball.x + dx * 0.5 - headLen * Math.cos(angle - 0.4),
    ball.y + dy * 0.5 - headLen * Math.sin(angle - 0.4)
  );
  ctx.moveTo(ball.x + dx * 0.5, ball.y + dy * 0.5);
  ctx.lineTo(
    ball.x + dx * 0.5 - headLen * Math.cos(angle + 0.4),
    ball.y + dy * 0.5 - headLen * Math.sin(angle + 0.4)
  );
  ctx.stroke();

  // Power meter
  const meter = document.getElementById('power-meter');
  const fill = document.getElementById('power-fill');
  meter.style.display = 'block';
  fill.style.width = `${power * 100}%`;

  // Predict trajectory
  const launchSpeed = power * MAX_SPEED;
  const vx = (dx / dist) * launchSpeed;
  const vy = (dy / dist) * launchSpeed;
  predictPath = predictTrajectory(ball.x, ball.y, vx, vy, 300);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Message overlay
let msgTimeout;
function showMessage(title, sub, duration) {
  const overlay = document.getElementById('message-overlay');
  document.getElementById('msg-title').textContent = title;
  document.getElementById('msg-sub').textContent = sub;
  overlay.classList.add('visible');
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(() => overlay.classList.remove('visible'), duration);
}

// Input handling
function getPos(e) {
  if (e.touches) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}

function onStart(e) {
  if (state !== 'aiming') return;
  const pos = getPos(e);
  const dx = pos.x - ball.x;
  const dy = pos.y - ball.y;
  // Allow drag from anywhere, not just ball
  isDragging = true;
  dragStart = pos;
  dragEnd = pos;
  e.preventDefault();
}

function onMove(e) {
  if (!isDragging) return;
  dragEnd = getPos(e);
  e.preventDefault();
}

function onEnd(e) {
  if (!isDragging || !dragStart || !dragEnd) {
    isDragging = false;
    return;
  }

  const dx = dragStart.x - dragEnd.x;
  const dy = dragStart.y - dragEnd.y;
  const dist = Math.sqrt(dx*dx + dy*dy);

  if (dist > 15) {
    const power = Math.min(dist / 200, 1);
    const launchSpeed = power * MAX_SPEED;
    ball.vx = (dx / dist) * launchSpeed;
    ball.vy = (dy / dist) * launchSpeed;
    state = 'flying';
    shotCount++;
    document.getElementById('shot-count').textContent = shotCount;
    document.getElementById('instructions').style.opacity = '0';
  }

  isDragging = false;
  dragStart = null;
  dragEnd = null;
  predictPath = [];
  document.getElementById('power-meter').style.display = 'none';
  e.preventDefault();
}

canvas.addEventListener('mousedown', onStart);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup', onEnd);
canvas.addEventListener('touchstart', onStart, { passive: false });
canvas.addEventListener('touchmove', onMove, { passive: false });
canvas.addEventListener('touchend', onEnd, { passive: false });

// Game loop
let lastTime = 0;
totalShots = 0;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  // Clear
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  const t = timestamp / 1000;

  // Draw
  drawStars(t);
  for (const p of planets) drawPlanet(p, t);
  drawTarget(t);
  drawTrail();
  if (state === 'aiming') {
    drawAimLine();
    drawPrediction();
  }
  drawBall();
  drawParticles();

  // Update
  updatePhysics(dt);
  updateParticles(dt);

  requestAnimationFrame(gameLoop);
}

// Start
loadLevel(0);
requestAnimationFrame(gameLoop);
</script>
